[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zenith-engine"
version = "1.4.0"
description = "High-performance asynchronous runtime and distributed task execution framework"
authors = [{ name = "Rohan Reddy Jakkam", email = "86797493+rohanreddy79@users.noreply.github.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "cryptography>=41.0.0",
    "prometheus-client>=0.19.0",
    "orjson>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]
