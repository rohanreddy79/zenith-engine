[package]
name = "sqrl-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sqrl-core = { path = "../crates/sqrl-core" }
sqrl-store = { path = "../crates/sqrl-store" }
sqrl-sim = { path = "../crates/sqrl-sim" }
arbitrary = { version = "1", features = ["derive"] }

[[bin]]
name = "wal_record"
path = "fuzz_targets/wal_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "replay"
path = "fuzz_targets/replay.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
