[package]
name = "sqrl"
description = "Embedded, deterministic-first durable execution for Rust: the SQLite of durable workflows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
default = []
# Dynamic least-loaded placement of NEW workflows across cores instead of
# static hash placement (benchmarked in Phase 2 for skewed id distributions).
# Orchestration remains thread-per-core; steps always run on the shared pool.
work-stealing = []

[dependencies]
sqrl-core.workspace = true
sqrl-store.workspace = true
sqrl-macros.workspace = true
serde.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tempfile.workspace = true
serde_json.workspace = true
