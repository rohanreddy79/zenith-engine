[package]
name = "sqrl"
description = "Embedded, deterministic-first durable execution for Rust: the SQLite of durable workflows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
default = []
# Dynamic least-loaded placement of NEW workflows across cores instead of
# static hash placement (benchmarked in Phase 2 for skewed id distributions).
# Orchestration remains thread-per-core; steps always run on the shared pool.
work-stealing = []
# NOTE: this feature's transitive dependencies (tonic/icu) require rustc
# 1.88, above the workspace MSRV of 1.85 which covers every other build.
# OpenTelemetry export: `sqrl::otel::init(...)` installs an OTLP trace
# pipeline for sqrl's tracing spans, and `sqrl::otel::register_metrics`
# exports engine/storage counters (throughput, fsyncs, backpressure, ...)
# as OTLP metrics.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]

[dependencies]
sqrl-core.workspace = true
sqrl-store.workspace = true
sqrl-macros.workspace = true
serde.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tempfile.workspace = true
serde_json.workspace = true
