[workspace]
resolver = "2"
members = [
    "crates/sqrl",
    "crates/sqrl-core",
    "crates/sqrl-sim",
    "crates/sqrl-store",
    "crates/sqrl-store-sqlite",
    "crates/sqrl-store-postgres",
    "crates/sqrl-macros",
    "crates/sqrl-cli",
    "benches",
    "bench-harness",
    "examples/checkout_saga",
    "examples/ai_agent_loop",
    "examples/long_running_counter",
    "examples/crash_me",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rohanreddy79/zenith-engine"
authors = ["sqrl contributors"]
keywords = ["durable-execution", "workflow", "wal", "deterministic", "embedded"]
categories = ["asynchronous", "database-implementations"]

[workspace.dependencies]
sqrl = { path = "crates/sqrl", version = "0.1.0" }
sqrl-core = { path = "crates/sqrl-core", version = "0.1.0" }
sqrl-sim = { path = "crates/sqrl-sim", version = "0.1.0" }
sqrl-store = { path = "crates/sqrl-store", version = "0.1.0" }
sqrl-store-sqlite = { path = "crates/sqrl-store-sqlite", version = "0.1.0" }
sqrl-store-postgres = { path = "crates/sqrl-store-postgres", version = "0.1.0" }
sqrl-macros = { path = "crates/sqrl-macros", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
rmp-serde = "1.3"
crc32c = "0.6"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", default-features = false }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# dev
proptest = "1"
criterion = "0.5"
tempfile = "3"
serde_json = "1"

[profile.release]
debug = true

[profile.bench]
debug = true
